baseurl: https://coderleechou.github.io/
languageCode: zh-cn
theme: stack
title: 我的博客
copyright: CoderLeechou

DefaultContentLanguage: zh
hasCJKLanguage: true

languages:
    zh:
        languageName: 简体中文
        title: 我的博客
        weight: 1
        params:
            sidebar:
                subtitle: 记录技术与生活

pagination:
    pagerSize: 5

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - posts
    rssFullContent: true

    footer:
        since: 2026

    dateFormat:
        published: 2006年1月2日
        lastUpdated: 2006年1月2日 15:04

    sidebar:
        emoji: 📝
        subtitle: 记录技术与生活
        avatar:
            enabled: true
            local: true
            src: img/avatar.png

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: false

    comments:
        enabled: false

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    colorScheme:
        toggle: true
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

menu:
    main: []

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/CoderLeechou
          params:
              icon: brand-github

        - identifier: rss
          name: RSS
          url: /index.xml
          params:
              icon: rss

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100
        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
